[package]
name = "maggotclaw-games"
version = "1.19.0-beta"
description = "Windows reader, feedback, and voice companion for MaggotClaw Games"
authors = ["Maggot Claw"]
edition = "2021"

[lib]
name = "the_long_rot_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
url = "2"
keyring = "3"
uiautomation = { version = "0.25", features = ["clipboard", "process"] }
windows = { version = "0.62", features = ["Foundation", "Media_SpeechRecognition", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }
