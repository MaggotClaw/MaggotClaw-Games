[package]
name = "the-long-rot-voice"
version = "0.1.0"
description = "Windows reader and spoken feedback application for The Long Rot"
authors = ["Maggot Claw"]
edition = "2021"

[lib]
name = "the_long_rot_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"

