[package]
name = "the-long-rot-voice"
version = "0.4.0"
description = "Windows reader, feedback, and voice companion for MaggotClaw Games"
authors = ["Maggot Claw"]
edition = "2021"

[lib]
name = "the_long_rot_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
url = "2"
keyring = "3"
uiautomation = { version = "0.25", features = ["clipboard", "process"] }
windows = { version = "0.62", features = ["Win32_UI_WindowsAndMessaging"] }
